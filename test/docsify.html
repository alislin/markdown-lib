<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD-Green Docsify 文档</title>
  <link rel="stylesheet" href="../dist/md-green.css">
  <link rel="stylesheet" href="_shared/nav.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      padding-top: 56px;
    }
    .markdown-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 56px;
      bottom: 0;
      width: 260px;
      padding: 32px 16px;
      background: var(--md-bg-secondary);
      border-right: 1px solid var(--md-border);
      overflow-y: auto;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar li {
      margin: 0;
    }
    .sidebar a {
      display: block;
      padding: 8px 12px;
      color: var(--md-text-secondary);
      text-decoration: none;
      border-radius: 4px;
    }
    .sidebar a:hover {
      background: var(--md-bg-table-hover);
      color: var(--md-link);
    }
    .sidebar a.active {
      background: var(--md-bg-code);
      color: var(--md-link);
    }
    .sidebar > ul > li > p {
      font-weight: 600;
      color: var(--md-text-heading);
      margin: 24px 0 8px 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #main {
      margin-left: 260px;
    }
    .sidebar-toggle {
      display: none;
    }
    @media screen and (max-width: 768px) {
      .sidebar {
        left: -260px;
        z-index: 50;
        transition: left 0.3s;
      }
      .sidebar.show {
        left: 0;
      }
      .sidebar-toggle {
        display: block;
        position: fixed;
        top: 72px;
        left: 16px;
        z-index: 60;
        padding: 8px;
        background: var(--md-bg-primary);
        border: 1px solid var(--md-border);
        border-radius: 4px;
        cursor: pointer;
      }
      #main {
        margin-left: 0;
      }
      .markdown-section {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <nav class="md-nav">
    <a class="md-nav-brand" href="index.html">Markdown Theme</a>
    <div class="md-nav-links">
      <a href="index.html">首页</a>
      <a href="vscode.html">VSCode</a>
      <a href="obsidian.html">Obsidian</a>
      <a href="docsify.html">Docsify</a>
      <a href="export.html">导出模板</a>
      <a href="theme-priority.html">优先级测试</a>
    </div>
    <div class="md-nav-theme">
      <button data-theme="light">浅色</button>
      <button data-theme="dark">深色</button>
      <button data-theme="auto">自动</button>
    </div>
  </nav>

  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

  <div class="sidebar" id="sidebar">
    <ul>
      <li><p>指南</p></li>
      <li><a href="#/" class="active">介绍</a></li>
      <li><a href="#/quickstart">快速开始</a></li>
      <li><a href="#/usage">使用方法</a></li>
      <li><p>配置</p></li>
      <li><a href="#/variables">CSS 变量</a></li>
      <li><a href="#/themes">主题定制</a></li>
      <li><p>其他</p></li>
      <li><a href="#/examples">示例</a></li>
      <li><a href="#/faq">常见问题</a></li>
    </ul>
  </div>

  <div id="main">
    <div class="markdown-section" id="app"></div>
  </div>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script>
    window.$docsify = {
      loadSidebar: false,
      loadNavbar: false,
      el: '#app',
      name: 'MD-Green Theme',
      repo: '',
      homepage: 'markdown/content.md',
      relativePath: true,
      markdown: {
        smartypants: true
      },
      routerMode: 'hash'
    };
  </script>
  
  <script src="_shared/nav.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
    }
    
    document.querySelectorAll('.sidebar a').forEach(function(link) {
      link.addEventListener('click', function() {
        document.getElementById('sidebar').classList.remove('show');
      });
    });
  </script>
</body>
</html>
