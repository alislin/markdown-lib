<head>

	<style>
:root {
  --fence-border: #e5e7eb;
  --fence-bg: #f9fafb;

<body>
	<h1>文档标题</h1>
	
	<p>这是一个使用 MD-Green 浅色主题渲染的文档。</p>

	<p>文档正文内容。支持<strong>加粗</strong>、<em>斜体</em>和<a href="#">链接</a>。</p>

	<ul>
		<li>列表项一</li>
		<li>列表项二</li>
	</ul>

	<pre><code class="language-javascript">function hello() {
  return "Hello, World!";
}</code></pre>

	<blockquote>
		<p>这是一段引用文本。</p>
	</blockquote>

	<hr>

	<p style="color: #888; font-size: 14px;">导出时间：2026-04-01</p>
